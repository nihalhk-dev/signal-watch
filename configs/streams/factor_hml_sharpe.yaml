# Stream: Sharpe mensual del factor HML (Fama-French), datos REALES.
#
# Este archivo es la UNICA fuente de los parametros de la serie real.
# gold/factor_metrics.py lo lee y se los pasa a processing/factor_returns.py;
# su config_hash sella el resultado (R7).
#
# DESVIACION DEL MANUAL, documentada a proposito:
#   El manual describia este stream como "Sharpe movil de HML, ventana 252 d".
#   Se cambia a Sharpe MENSUAL SIN SOLAPE. Motivo medido, no opinado: la
#   ventana movil diaria comparte 251 de 252 datos con el punto anterior
#   (autocorrelacion +0,996) y un umbral calibrado sobre ella no significa lo
#   que dice (ARL0 real 213 cuando se pidio 100). Ver MEMORIA, secciones 5 y 9.
#
# Las fechas van ENTRE COMILLAS a proposito: sin ellas YAML las lee como
# objetos fecha, y el config_hash (que serializa a JSON) fallaria.

stream_id: factor_hml_sharpe
fuente: kenneth_french
factor: hml
metrica: sharpe_mensual_anualizado
direction: lower_is_worse
frecuencia: mensual

# 1963-07: muestra canonica de la literatura de factores, y posterior al fin
# de las sesiones de sabado en la NYSE (1952).
inicio_muestra: "1963-07-01"

# Ventana de referencia para calibrar el detector: ANTERIOR a la publicacion
# de Fama-French (1992), cuando nadie arbitraba aun el factor. Todo lo
# posterior es lo que se vigila y no participa en fijar el umbral.
fin_calibracion: "1990-12-31"

# Meses con menos dias habiles se descartan: un Sharpe con 6 datos es ruido.
min_dias_por_mes: 15

# ── Monitorizacion (scripts/run_monitoring.py) ──────────────────────────
monitorizacion:
  # Una falsa alarma por decada y modelo: es el objetivo que un comite de
  # modelos elegiria a proposito, y el mismo de la simulacion de cadencia.
  # LOS TRES detectores se calibran a este mismo ARL0 (MEMORIA 8.6).
  arl0_objetivo_meses: 120

  # Los mismos parametros de forma que en el Bloque 4, para que los
  # detectores sean los mismos en las dos ramas.
  k_cusum: 0.5
  delta_page_hinkley: 0.25

  # Series "sin cambio" fabricadas remuestreando la ventana de referencia.
  # Longitud = 5 x ARL0: con series mas cortas el ARL0 saldria censurado
  # (la leccion de MEMORIA 14.2).
  bootstrap_bloque_meses: 6
  bootstrap_longitud_meses: 600
  bootstrap_n_series: 1000

  # Dos semillas: con una se calibra, con la otra se verifica (R4).
  # Lejos de todos los rangos del banco sintetico (0 .. 1.503.199).
  semilla_calibracion: 9000000
  semilla_verificacion: 9500000

# ── Retardo sobre ruido real: inyeccion de un cambio conocido ──────────
# Sobre la serie cruda no hay tau. Aqui se fabrica: ruido real (bootstrap
# de la referencia) + una caida de tamano conocido en el mes `tau`. Se usan
# los umbrales YA calibrados arriba, sin reajustar.
inyeccion:
  escenarios: [salto, deriva]
  # 0.15 sigma = el factor pasa a Sharpe cero (0.86 / 5.71): lo que importa.
  # 0.25 sigma ~ la caida de los 2010. 1 y 2 sigma conectan con el Bloque 4.
  deltas_sigma: [0.15, 0.25, 0.5, 1.0, 2.0]
  # tau corto: con ARL0 = 120, un tau de 60 excluiria ~40% de series por
  # falsa alarma ANTES del cambio (el sesgo de MEMORIA 8.2). Con 24, ~18%.
  tau_meses: 24
  # detectar 0.15 sigma cuesta ~5 anos: con menos horizonte, todo censurado
  horizonte_meses: 216
  n_series: 1000
  # distinta de calibracion y verificacion (R4)
  semilla: 9900000
  # Fuera de muestra: la referencia se parte en tramos de 12 meses alternos.
  # Pares (A) calibran los umbrales de ESTE experimento; impares (B) ponen
  # el ruido donde se inyecta. Ningun mes esta en las dos mitades.
  # Alternos y no "primera mitad / segunda mitad" porque los 60 y los 80 no
  # tienen el mismo Sharpe. 12 >= bootstrap_bloque_meses (6): un bloque
  # siempre cabe dentro de su tramo.
  particion_tramo_meses: 12
